entrypoint:
  - /usr/bin/python3 ${TACC_WORKDIR}/main.py
environment:
  name: mpi-gemm-v1
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: train-sft
  general:
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=8
    - gres=gpu:2
    - time=01:00:00
    - job-name=train-sft
    - output=${TACC_SLURM_USERLOG}/train-sft-%j.log
