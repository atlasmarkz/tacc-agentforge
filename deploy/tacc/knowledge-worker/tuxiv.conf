entrypoint:
  - /usr/bin/python3 ${TACC_WORKDIR}/main.py
environment:
  name: mpi-gemm-v1
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: knowledge-worker
  general:
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=2
    - job-name=knowledge-worker
    - time=00:20:00
    - output=${TACC_SLURM_USERLOG}/knowledge-worker-%j.log
