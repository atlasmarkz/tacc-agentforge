entrypoint:
  - bash ${TACC_WORKDIR}/job.sh
environment:
  name: mpi-gemm-v1
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: qwen-private-client
  general:
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=1
    - time=00:10:00
    - output=${TACC_SLURM_USERLOG}/qwen-private-client-%j.log
