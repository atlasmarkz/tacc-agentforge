entrypoint:
  - /usr/bin/python3 ${TACC_WORKDIR}/main.py
environment:
  name: mpi-gemm-v1
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: benchmark-v1
  general:
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=4
    - job-name=benchmark-v1
    - time=00:30:00
    - output=${TACC_SLURM_USERLOG}/benchmark-v1-%j.log
