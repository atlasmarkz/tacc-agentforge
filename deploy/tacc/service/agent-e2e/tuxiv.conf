entrypoint:
  - /usr/bin/python3 ${TACC_WORKDIR}/main.py
environment:
  name: mpi-gemm-v1
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: agent-e2e
  general:
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=4
    - job-name=agent-e2e
    - time=01:00:00
    - output=${TACC_SLURM_USERLOG}/agent-e2e-%j.log
