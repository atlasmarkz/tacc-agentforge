entrypoint:
  - /usr/bin/python3 ${TACC_WORKDIR}/main.py
environment:
  name: mpi-gemm-v1
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: qwen-service
  general:
    - partition=tacc
    - exclude=10-0-1-11
    - nodes=1
    - ntasks=1
    - cpus-per-task=8
    - gres=gpu:2
    - job-name=qwen-service
    - time=01:00:00
    - output=${TACC_SLURM_USERLOG}/qwen-service-%j.log
