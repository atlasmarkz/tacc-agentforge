entrypoint:
  - /usr/bin/python3 ${TACC_WORKDIR}/main.py
environment:
  name: mpi-gemm-v1
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: net-probe
  general:
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=1
    - job-name=net-probe
    - time=00:12:00
    - output=${TACC_SLURM_USERLOG}/net-probe-%j.log
