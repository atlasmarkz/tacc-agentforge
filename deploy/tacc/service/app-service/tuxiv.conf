entrypoint:
  - /usr/bin/python3 ${TACC_WORKDIR}/main.py
environment:
  name: mpi-gemm-v1
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: app-service
  general:
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=4
    - job-name=app-service
    - time=01:00:00
    - output=${TACC_SLURM_USERLOG}/app-service-%j.log
