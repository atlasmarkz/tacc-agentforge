entrypoint:
  - /usr/bin/python3 ${TACC_WORKDIR}/main.py
environment:
  name: mpi-gemm-v1
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: load-test
  general:
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=4
    - job-name=load-test
    - time=00:45:00
    - output=${TACC_SLURM_USERLOG}/load-test-%j.log
