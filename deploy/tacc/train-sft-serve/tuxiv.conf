entrypoint:
  - /usr/bin/python3 ${TACC_WORKDIR}/main.py
environment:
  name: mpi-gemm-v1
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: train-sft-serve
  general:
    - partition=tacc
    - exclude=10-0-1-11
    - nodes=1
    - ntasks=1
    - cpus-per-task=8
    - gres=gpu:2
    - time=00:45:00
    - job-name=train-sft-serve
    - output=${TACC_SLURM_USERLOG}/train-sft-serve-%j.log
