<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Advisor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Warm paper, product photos first, one accent colour, plain-language progress. Fonts fall back to system fonts
   when Google Fonts is unreachable. */
:root {
  --paper: #F6F2EC; --paper-2: #EFE9E0; --card: #FFFDFA; --ink: #1D1B18; --ink-2: #4F4A43; --muted: #8A847B;
  --line: #E4DCCF; --line-2: #D5C9B8; --accent: #C2502A; --accent-2: #A84322; --ok: #2E6B4E; --ok-bg: #E6F0E9;
  --warn: #8A5A12; --warn-bg: #FBF1E2; --bad: #A33A2B; --bad-bg: #F9E8E4; --soft: #F3ECE2;
  --shadow: 0 1px 0 rgba(29,27,24,.04), 0 10px 28px -14px rgba(29,27,24,.22);
  --sans: "Onest", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --serif: "Instrument Serif", "Noto Serif SC", Georgia, serif;
  --r: 18px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
img { display: block; max-width: 100%; }
.hidden { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

/* header */
header.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between;
  padding: 14px 28px; background: rgba(246,242,236,.88); backdrop-filter: blur(10px); border-bottom: 1px solid transparent; }
header.top.scrolled { border-bottom-color: var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; letter-spacing: -.01em; background: none; border: 0; padding: 0; }
.brand svg { width: 30px; height: 30px; }
.top-right { display: flex; align-items: center; gap: 10px; }
.health { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); padding: 0 6px; }
.dot { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%; background: #CFC5B6; }
.dot.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(46,107,78,.15); }
.dot.bad { background: var(--bad); }
.modelchip { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px 5px 6px; }
.modelchip .mk { width: 20px; height: 20px; border-radius: 6px; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.modelchip b { font-weight: 600; color: var(--ink); }
.powered { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin-top: 14px; }
.powered b { color: var(--ink-2); font-weight: 600; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 14px; }
.ghost:hover { background: var(--card); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--card); }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 5px 11px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

.layout { display: flex; align-items: flex-start; }
.content { flex: 1; min-width: 0; }
main { padding: 0 28px 90px; }

/* history sidebar */
.side { width: 272px; flex: none; position: sticky; top: 59px; height: calc(100vh - 59px); overflow-y: auto; overflow-x: hidden; border-right: 1px solid var(--line);
  padding: 18px 14px 24px; display: flex; flex-direction: column; gap: 4px; }
.side .newbtn { display: flex; align-items: center; gap: 8px; width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; font-size: 14px; font-weight: 500; margin-bottom: 14px; }
.side .newbtn:hover { border-color: var(--line-2); }
.side .newbtn svg { width: 16px; height: 16px; }
.side h5 { margin: 14px 8px 6px; font-size: 12px; font-weight: 500; color: var(--muted); }
.hitem { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: center; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 12px; padding: 7px 8px; }
.hitem:hover { background: var(--paper-2); }
.hitem.on { background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
.hitem .hp { width: 36px; height: 36px; border-radius: 9px; background: #fff; border: 1px solid #EFE8DD; display: grid; place-items: center; overflow: hidden; }
.hitem .hp img { width: 86%; height: 86%; object-fit: contain; }
.hitem .hp svg { width: 18px; height: 18px; color: #CFC5B6; }
.hitem > span:last-child { min-width: 0; }
.hitem .ht { font-size: 14px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hitem .hm { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hitem .hm .okc { color: var(--ok); }
.side .empty { font-size: 13px; color: var(--muted); padding: 6px 8px; }
.side .clear { margin-top: auto; background: none; border: 0; color: var(--muted); font-size: 12px; text-align: left; padding: 14px 8px 0; }
.side .clear:hover { color: var(--ink-2); }

/* home */
.home { max-width: 780px; margin: 0 auto; min-height: calc(100vh - 150px); display: flex; flex-direction: column; justify-content: center; padding-top: 24px; }
.home h1 { font-family: var(--serif); font-weight: 400; font-size: 76px; line-height: 1.0; letter-spacing: -.015em; margin: 0 0 16px; }
html[lang="zh"] .home h1 { font-weight: 600; font-size: 58px; letter-spacing: 0; line-height: 1.15; }
.home .lead { color: var(--ink-2); font-size: 19px; max-width: 600px; margin: 0 0 30px; }

.composer { background: var(--card); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); padding: 18px 18px 14px; transition: border-color .2s; }
.composer:focus-within { border-color: #CDBFAC; }
.composer textarea { width: 100%; border: 0; outline: 0; resize: none; background: transparent; font-size: 19px; line-height: 1.5; min-height: 60px; max-height: 220px; padding: 2px 4px; }
.composer textarea::placeholder { color: #A9A297; }
.composer .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
.composer .opts { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--soft); border-radius: 999px; padding: 6px 12px; font-size: 14px; color: var(--ink-2); }
.pill input { width: 72px; border: 0; background: transparent; outline: 0; font-variant-numeric: tabular-nums; }
.pill select { border: 0; background: transparent; outline: 0; padding: 0; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); cursor: pointer; user-select: none; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.toggle .sw { width: 34px; height: 20px; border-radius: 999px; background: #D9CFC2; position: relative; transition: background .2s; flex: none; }
.toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.toggle input:checked + .sw { background: var(--ok); }
.toggle input:checked + .sw::after { transform: translateX(14px); }
.toggle input:focus-visible + .sw { outline: 2px solid var(--accent); outline-offset: 2px; }
.send { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; display: grid; place-items: center; transition: background .15s, transform .15s; flex: none; }
.send:hover { background: var(--accent-2); }
.send:active { transform: scale(.96); }
.send:disabled { background: #D9CFC2; cursor: default; }
.send svg { width: 20px; height: 20px; }

.examples { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.ex { display: flex; align-items: center; gap: 12px; text-align: left; background: transparent; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; color: var(--ink-2); font-size: 15px; transition: background .15s, border-color .15s, color .15s; }
.examples .ex:last-child:nth-child(odd) { grid-column: 1 / -1; }
.ex:hover { background: var(--card); border-color: var(--line-2); color: var(--ink); }
.ex .ico { width: 38px; height: 38px; border-radius: 11px; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
.ex .ico svg { width: 20px; height: 20px; stroke: var(--ink-2); }
.fine { color: var(--muted); font-size: 13px; margin-top: 24px; }

/* conversation */
.thread { max-width: 900px; margin: 0 auto; padding-top: 30px; }
.you { display: flex; justify-content: flex-end; margin-bottom: 24px; }
.you p { margin: 0; background: var(--paper-2); border-radius: 20px 20px 4px 20px; padding: 13px 18px; max-width: 78%; font-size: 17px; white-space: pre-line; }
.you .meta { display: block; font-size: 13px; color: var(--muted); margin-top: 4px; }

details.trace { margin: 0 0 22px; }
details.trace > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; background: var(--card); font-size: 14px; color: var(--ink-2); }
details.trace > summary::-webkit-details-marker { display: none; }
details.trace[open] > summary { border-color: transparent; background: transparent; padding-left: 0; }
details.trace > summary .chev { color: var(--muted); transition: transform .2s; }
details.trace[open] > summary .chev { transform: rotate(180deg); }
.pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; flex: none; }
.trace.done .pulse { background: var(--ok); animation: none; }
.trace.fail .pulse { background: var(--bad); animation: none; }
@keyframes pulse { 0%,100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
.stopbtn { margin-left: 6px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--ink-2); }

.steps { list-style: none; margin: 14px 0 0 5px; padding: 0; border-left: 1px solid var(--line); }
.step { position: relative; padding: 0 0 16px 24px; }
.step::before { content: ""; position: absolute; left: -6px; top: 6px; width: 11px; height: 11px; border-radius: 50%; background: var(--paper); border: 1.5px solid #CFC5B6; }
.step.active::before { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 4px rgba(194,80,42,.15); }
.step.done::before { border-color: var(--ok); background: var(--ok); }
.step.fail::before { border-color: var(--bad); background: var(--bad); }
.step h3 { margin: 0; font-size: 15px; font-weight: 600; }
.step:not(.done):not(.active):not(.fail) h3 { color: var(--muted); font-weight: 500; }
.step .d { color: var(--ink-2); font-size: 14px; margin-top: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.q { font-size: 13px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--ink-2); animation: pop .3s ease both; }
.q.bad { color: var(--bad); border-color: #EBC9C1; }
@keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
details.log { margin: 2px 0 0 29px; font-size: 13px; color: var(--muted); }
details.log summary { cursor: pointer; }
ol.logl { list-style: none; padding: 6px 0 0; margin: 0; max-height: 260px; overflow: auto; }
ol.logl li { display: flex; gap: 10px; padding: 2px 0; }
ol.logl .t { font-variant-numeric: tabular-nums; min-width: 44px; color: #A9A297; }
ol.logl .bad { color: var(--bad); }

.notice { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-radius: 14px; padding: 12px 16px; margin: 10px 0; font-size: 15px; }
.notice.warn { background: var(--warn-bg); color: var(--warn); }
.notice.err { background: var(--bad-bg); color: var(--bad); }
.notice button { border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 999px; padding: 4px 12px; font-size: 13px; }

/* question */
.ask { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px 22px; margin: 0 0 24px; animation: rise .4s ease both; }
.ask h2 { font-size: 18px; margin: 0 0 6px; }
.ask .qtext { margin: 0 0 16px; color: var(--ink-2); font-size: 16px; }
.fields { display: flex; flex-direction: column; gap: 18px; margin-bottom: 18px; }
.fgroup { display: flex; flex-direction: column; gap: 8px; }
.flabel { font-size: 14px; font-weight: 600; }
.qchips { display: flex; flex-wrap: wrap; gap: 8px; }
.qchip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 7px 14px; font-size: 14px; transition: background .15s, border-color .15s, color .15s; }
.qchip:hover { border-color: var(--line-2); background: #fff; }
.qsets { display: flex; flex-direction: column; gap: 8px; }
.qcap { font-size: 12px; color: var(--muted); margin-top: 2px; }
.qchip.cat { background: var(--ok-bg); border-color: #CFE0D4; color: var(--ok); font-weight: 500; }
.qchip.cat:hover { background: #DCEBE0; }
.qchip.cat[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.qchip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.f { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500; }
.input { border: 1px solid var(--line); background: var(--paper); border-radius: 12px; padding: 10px 12px; outline: 0; font-weight: 400; }
.input:focus { border-color: var(--line-2); background: #fff; }
.primary { background: var(--ink); color: var(--paper); border: 0; border-radius: 999px; padding: 10px 22px; font-weight: 500; }
.primary:disabled { opacity: .35; cursor: default; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.skel { border-radius: 22px; height: 230px; background: linear-gradient(90deg, var(--paper-2), #F5EFE6, var(--paper-2)); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* result */
.result { animation: rise .45s ease both; }
.lead-line { font-size: 21px; line-height: 1.5; margin: 0 0 20px; }
.lead-line b { font-weight: 600; }
.hero { display: grid; grid-template-columns: 260px 1fr; gap: 26px; background: var(--card); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); padding: 20px; margin-bottom: 14px; }
.pic { background: #fff; border-radius: 16px; display: grid; place-items: center; aspect-ratio: 1; border: 1px solid #EFE8DD; position: relative; overflow: hidden; }
.pic img { width: 84%; height: 84%; object-fit: contain; animation: pop .4s ease both; }
.pic svg { width: 64px; height: 64px; color: #CFC5B6; }
.tag { position: absolute; z-index: 1; top: 10px; left: 10px; background: var(--ink); color: var(--paper); font-size: 12px; border-radius: 999px; padding: 3px 10px; }
.hero h2 { font-size: 23px; line-height: 1.3; margin: 4px 0 8px; letter-spacing: -.01em; }
.seller { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); }
.seller img { width: 16px; height: 16px; border-radius: 50%; }
.seen { font-size: 13px; color: var(--muted); }
.price { display: flex; align-items: baseline; gap: 12px; margin: 12px 0 12px; flex-wrap: wrap; }
.price .now { font-size: 36px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.okbadge { display: inline-flex; align-items: center; gap: 5px; background: var(--ok-bg); color: var(--ok); font-size: 13px; font-weight: 500; border-radius: 999px; padding: 3px 10px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.fact { font-size: 13px; background: var(--soft); border-radius: 8px; padding: 4px 9px; color: var(--ink-2); }
.fact.good { background: var(--ok-bg); color: var(--ok); }
.fact.warn { background: var(--warn-bg); color: var(--warn); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-accent { display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: #fff; text-decoration: none; border-radius: 999px; padding: 10px 18px; font-weight: 500; }
.btn-accent:hover { background: var(--accent-2); }
.btn-line { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 9px 16px; text-decoration: none; }
.btn-line:hover { background: var(--paper); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 14px; margin-bottom: 14px; }
.pcard { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: 14px; animation: rise .45s ease both; }
.pcard .pic { margin-bottom: 12px; }
.pcard .seller { flex-wrap: wrap; column-gap: 7px; row-gap: 0; line-height: 1.35; }
.pcard .seller .seen { flex-basis: 100%; }
.pcard h2 { font-size: 16px; line-height: 1.35; margin: 6px 0 4px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.pcard .price { margin: 6px 0 8px; }
.pcard .price .now { font-size: 26px; }
.pcard .facts { margin-bottom: 12px; }
.pcard .actions { margin-top: auto; }
.pcard .btn-accent { padding: 8px 14px; font-size: 14px; }
.receipt .ln.item span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 190px; }
.mini { display: grid; grid-template-columns: 76px 1fr auto; gap: 14px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px 10px 10px; margin-bottom: 10px; }
.mini .pic { border-radius: 12px; }
.mini h2 { font-size: 15px; margin: 0; font-weight: 500; }
.mini .now { font-weight: 600; font-variant-numeric: tabular-nums; }

.cols { display: grid; grid-template-columns: 1fr 310px; gap: 16px; margin-top: 6px; align-items: start; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 22px; }
.panel h3 { margin: 0 0 12px; font-size: 16px; }
.whytext { color: var(--ink-2); }
.rcard { display: grid; grid-template-columns: 40px 1fr; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
.rcard:first-of-type { border-top: 0; padding-top: 4px; }
.rico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--soft); color: var(--accent); }
.rico.ok { background: var(--ok-bg); color: var(--ok); }
.rico svg { width: 20px; height: 20px; }
.rt { font-weight: 600; font-size: 15px; margin-bottom: 3px; }
.rb { color: var(--ink-2); font-size: 15px; }
.rb b { color: var(--ink); font-weight: 600; }
.rb q { quotes: "“" "”"; color: var(--ink); }
.rb .hit { background: var(--ok-bg); color: var(--ok); border-radius: 6px; padding: 0 6px; font-weight: 500; white-space: nowrap; }
.hl { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.hl span { background: var(--soft); border-radius: 999px; padding: 3px 10px; font-size: 13px; color: var(--ink-2); }
.ritems { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 10px 0 6px; }
.ritem { display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); border-radius: 16px; padding: 12px; background: var(--paper); }
.ritem .rp { font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; }
.ritem .th { width: 100%; height: 128px; border-radius: 12px; background: #fff; border: 1px solid #EFE8DD; display: grid; place-items: center; overflow: hidden; position: relative; margin-bottom: 4px; }
.rrow { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; border-top: 1px solid var(--line); margin-top: 8px; }
.rrow .rcard { border-top: 0; }
.ritem .th img { width: 88%; height: 88%; object-fit: contain; }
.ritem .th b { position: absolute; top: 8px; left: 8px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: var(--paper); font-size: 12px; display: grid; place-items: center; }
.ritem .tt { font-weight: 600; font-size: 15px; line-height: 1.35; }
.ritem .tag2 { display: inline-block; background: var(--ok-bg); color: var(--ok); font-size: 12px; font-weight: 500; border-radius: 999px; padding: 1px 9px; margin-right: 6px; vertical-align: 1px; }
.whymodel { margin-top: 6px; border-top: 1px solid var(--line); padding-top: 14px; }
.mlabel { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.mlabel .mk { width: 20px; height: 20px; border-radius: 6px; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.narr { margin: 0 0 18px; padding: 16px 18px 8px; border: 1px solid #F1E2CF; border-radius: 16px; background: linear-gradient(135deg, #FFF7EC 0%, #FFFDFA 70%); }
.narr .mlabel { margin-bottom: 10px; }
.narrtext { font-size: 16.5px; line-height: 1.85; color: var(--ink); min-height: 28px; }
.narrtext p { margin: 0 0 12px; }
.narrtext.caret p:last-child::after { content: "▍"; color: var(--accent); margin-left: 2px; animation: pulse 1s steps(2) infinite; }

.whytext.caret::after { content: "▍"; color: var(--accent); animation: pulse 1s steps(2) infinite; }

.receipt { font-variant-numeric: tabular-nums; font-size: 15px; }
.receipt .ln { display: flex; justify-content: space-between; padding: 6px 0; color: var(--ink-2); }
.receipt .ln.dim span:last-child { color: var(--muted); }

.bar i { display: block; height: 100%; background: var(--ok); border-radius: 999px; width: 0; transition: width .9s cubic-bezier(.2,.8,.2,1); }
.bar.tight i { background: var(--accent); }
.left { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.left b { color: var(--ok); font-weight: 600; }

.src .st { font-size: 14px; line-height: 1.35; font-weight: 500; }

.src .sx { font-size: 13px; color: var(--ink-2); margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

.follow { margin-top: 34px; }

<body>
<header class="top" id="top">
  <button class="brand" id="brand" type="button" aria-label="Shop Advisor">

    <span class="health" id="health"><span class="dot"></span><span data-i="checking"></span></span>

  </div>
</header>

<div class="layout">
<aside class="side" id="side" aria-label="History">
  <button class="newbtn" id="sideNew" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-i="newChat"></span></button>
  <div id="history"></div>
  <button class="clear hidden" id="clearHistory" type="button" data-i="clearHistory"></button>
</aside>
<div class="content">
<main>
  <section class="home" id="home">
    <h1 data-i="homeTitle"></h1>
    <p class="lead" data-i="homeLead"></p>
    <form class="composer" id="searchForm" autocomplete="off">
      <textarea id="msg" rows="2" aria-label="Request"></textarea>
      <div class="row">
        <div class="opts">

      </div>
    </form>
    <div class="powered hidden" id="powered"></div>
    <div id="topNotice"></div>
    <div class="examples" id="examples"></div>
    <p class="fine" data-i="fine"></p>
  </section>

  <section class="thread hidden" id="thread" aria-live="polite">
    <div class="you"><p id="bubble"></p></div>

    <details class="trace" id="trace" open>
      <summary><span class="pulse"></span><span id="progTitle"></span><span class="seen" id="runId"></span><button class="stopbtn hidden" id="cancel" type="button" data-i="stop"></button><span class="chev">▾</span></summary>
      <ol class="steps" id="stepper">
        <li class="step" data-k="understand"><h3 data-i="sUnderstand"></h3><div class="d" id="dUnderstand"></div></li>
        <li class="step" data-k="search"><h3 data-i="sSearch"></h3><div class="chips" id="dSearch"></div></li>
        <li class="step" data-k="compare"><h3 data-i="sCompare"></h3><div class="chips" id="dCompare"></div></li>
        <li class="step" data-k="check"><h3 data-i="sCheck"></h3><div class="d" id="dCheck"></div></li>
        <li class="step" data-k="explain"><h3 data-i="sExplain"></h3><div class="d" id="dExplain"></div></li>
      </ol>
      <details class="log"><summary data-i="log"></summary><ol class="logl" id="steps"></ol></details>
    </details>

    <section class="ask hidden" id="question">
      <h2 data-i="askTitle"></h2>
      <p class="qtext" id="qText"></p>
      <div id="qNotice"></div>
      <form id="qForm" autocomplete="off">
        <div class="fields" id="qFields"></div>
        <button class="primary" id="qSend" type="submit" data-i="continue"></button>
      </form>
    </section>

    <div id="streamError"></div>
    <div class="skel hidden" id="skel"></div>

    <section class="result hidden" id="result">
      <div id="resultStatus"></div>
      <p class="lead-line hidden" id="lead"></p>
      <div id="products"></div>
      <div class="cols" id="cols">
        <section class="panel hidden" id="why"><h3 data-i="whyTitle"></h3><div class="narr hidden" id="whyNarr"><div class="mlabel"><span class="mk">AI</span><span data-i="narrTitle"></span></div><div class="narrtext" id="narrText"></div></div><div class="factsh" data-i="factsTitle"></div><div id="whyCards"></div><div class="whymodel hidden" id="whyModel"><div class="mlabel"><span class="mk">AI</span><span data-i="modelSays"></span></div><div class="whytext" id="whyText"></div></div><div class="whynote" id="whyNote"></div></section>
        <section class="panel receipt hidden" id="summary"><h3 data-i="payTitle"></h3><div id="sumTable"></div><div class="bar" id="meter"><i></i></div><div class="left" id="meterText"></div></section>
      </div>
      <section class="hidden" id="sourcesCard"><h4 class="sec" id="sourcesAnchor" data-i="sourcesTitle"></h4><ol class="sources" id="sources"></ol></section>
    </section>

    <section class="follow hidden" id="refine">
      <h4 class="sec" style="margin-top:0" data-i="refineTitle"></h4>
      <div class="chips" id="refineChips"></div>
      <form class="composer" id="revForm" autocomplete="off">
        <textarea id="revMsg" rows="1" aria-label="Change"></textarea>
        <div class="row">
          <label class="pill"><span data-i="newBudget"></span> $ <input id="revCap" inputmode="decimal" placeholder="50" aria-label="New budget"></label>
          <button class="send" id="revSend" type="submit" aria-label="Update"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </form>
      <div class="stats hidden" id="stats"></div>
    </section>
  </section>
</main>
<footer data-i="footer"></footer>
</div>
</div>

async function streamCall(path, body, onEvent, signal) {
  const resp = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, signal,
                                   body: JSON.stringify({ session_id: session, ...body }) });
  if (!resp.ok) {
    let msg = ERRORS[LANG].failedReq(resp.status);
    try { const j = await resp.json(); msg = (j.error && (ERRORS[LANG][j.error.code] || j.error.message)) || msg; } catch (e) {}

}

    }));
    cards.push(el("div", { class: "rcard" }, el("div", { class: "rico", html: ICON.goal }),
      el("div", {}, el("div", { class: "rt" }, T.rFit), el("div", { class: "rb", html: goalHtml }))), list);
  }
  const ship = "shipping" in cb ? (Number(cb.shipping) === 0 ? T.rFreeShip : T.rShip(fmt(cb.shipping, cur))) : "";
  const money = rows.length === 1 ? T.rPriceOne(fmt(total, cur), pct, ship)
                                  : T.rPriceMany(rows.reduce((n, r) => n + r.it.quantity, 0), fmt(total, cur), pct);
  const tail = [card("wallet", "ok", T.rBudget, money + sp + T.rLeft(fmt(left, cur)))];
  const dates = look.offers.map((o) => o.observed_at).filter(Boolean).sort(), date = dates.length ? day(dates[dates.length - 1]) : "";
  const who = rows.length === 1 ? (rows[0].shop.merchant || (rows[0].shop.url ? hostOf(rows[0].shop.url) : "")) : "";
  const stale = look.offers.some((o) => o.price_stale);
  tail.push(card("shield", "ok", T.rChecked, (rows.length === 1 && who ? T.rSource(esc(who), date) : T.rSourceMany(date))
                 + ("tax" in cb ? "" : sp + T.rTax) + (stale ? sp + T.rStale : "")));
  const many = rows.length > 1;
  $("whyCards").replaceChildren(...cards, ...(many ? [el("div", { class: "rrow" }, ...tail)] : tail));
  show("why", true);
  // A set of products gets the full width (cards side by side); one product keeps the reasons beside the receipt.
  $("cols").style.gridTemplateColumns = many ? "1fr" : "";
  $("summary").style.maxWidth = many ? "560px" : "";
}

const shortTitle = (t) => !t || t.length <= 64 ? t : t.slice(0, Math.max(t.lastIndexOf(" ", 62), 40)).replace(/[\s,\-–]+$/, "") + "…";
function leadHtml(p) {
  const T = L(), info = offerInfo(p), it = p.items[0];
  if (p.items.length > 1) {
    const n = p.items.reduce((s, i) => s + i.quantity, 0);
    return T.leadMulti(n, fmt(p.total_cost, p.currency), "tax" in (p.cost_breakdown || {}) ? "" : T.pre, fmt(p.remaining_funds, p.currency));
  }
  const what = esc((it.quantity > 1 ? it.quantity + " × " : "") + (shortTitle(info.title) || T.thisOffer)) + (p.items.length > 1 ? " +" + (p.items.length - 1) : "");
  const cb = p.cost_breakdown || {};
  const ship = "shipping" in cb ? (Number(cb.shipping) === 0 ? T.freeShip : T.withShip(fmt(cb.shipping, p.currency))) : "";
  return T.lead(what, info.seller ? esc(T.from(info.seller)) : "", fmt(p.total_cost, p.currency), "tax" in cb ? "" : T.pre, ship, fmt(p.remaining_funds, p.currency));
}
function renderLead(p) { $("lead").innerHTML = leadHtml(p); show("lead", true); }

function heroCard(it, cur) {

function miniCard(it, cur) {

    el("div", { class: "now" }));
}

function summary(p) {
  const T = L(), t = $("sumTable"), cb = p.cost_breakdown || {}, pre = !("tax" in cb);
  const names = { items: T.items, shipping: T.shipping, tax: T.taxL };
  t.replaceChildren(...Object.entries(cb).map(([k, v]) =>
    el("div", { class: "ln" }, el("span", {}, names[k] || k), el("span", {}, Number(v) === 0 && k === "shipping" ? T.free : fmt(v, p.currency)))));
  if (pre) t.append(el("div", { class: "ln dim" }, el("span", {}, T.taxL), el("span", {}, T.notIncl)));
  t.append(el("div", { class: "ln tot" }, el("span", {}, pre ? T.totalPre : T.total), el("span", {}, fmt(p.total_cost, p.currency))));
  const total = Number(p.total_cost), left = Number(p.remaining_funds), budget = total + left;
  const pct = budget > 0 ? Math.min(100, Math.round(total / budget * 100)) : 0;
  $("meter").classList.toggle("tight", pct > 85);
  const bar = $("meter").firstElementChild; bar.style.width = "0";
  requestAnimationFrame(() => requestAnimationFrame(() => (bar.style.width = pct + "%")));
  const [lw, lv] = T.leftOf(fmt(p.remaining_funds, p.currency));
  $("meterText").replaceChildren(el("span", {}, T.budgetOf(fmt(budget, p.currency))), el("span", {}, lw, el("b", {}, lv)));
  show("summary", true);
}

async function lookup(plan) {
  const offer_ids = plan.items.map(i => i.offer_id);
  const evidence_ids = [...new Set(plan.items.flatMap(i => i.evidence_ids))];
  try {
    const resp = await fetch("/api/lookup", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: session, run_id: state.runId, offer_ids, evidence_ids }) });
    const r = await resp.json();
    if (!resp.ok) throw new Error(r.error && (ERRORS[LANG][r.error.code] || r.error.message));
    state.look = r;
    fillLookup(plan, r);
    saveHistory();
  } catch (e) {
    $("sources").replaceChildren(el("li", { class: "seen" }, ERRORS[LANG].noSources + e.message));
    show("sourcesCard", true);
    saveHistory();
  }
}

function fillLookup(plan, r) {
  const T = L(), sellerOf = {}, linkOf = {};
  for (const e of r.evidence) {
    if (e.source_label && !sellerOf[e.variant_id]) sellerOf[e.variant_id] = e.source_label;
    if (/^https?:\/\//.test(e.source_url || "") && !linkOf[e.variant_id]) linkOf[e.variant_id] = e.source_url;
  }
  state.sellerOf = sellerOf;
  const seen = new Set();
  for (const o of r.offers) {
    if (seen.has(o.offer_id)) continue;
    seen.add(o.offer_id);
    const node = document.querySelector(`[data-offer="${CSS.escape(o.offer_id)}"]`);
    if (!node) continue;
    const shop = (r.shops || {})[o.offer_id] || {};
    const url = shop.url || linkOf[o.variant_id] || null;
    const seller = shop.merchant || sellerOf[o.variant_id] || hostOf(url) || "";
    const photo = (r.photos || {})[o.variant_id];
    node.querySelector(".ptitle").textContent = o.store_title || o.offer_id;
    if (photo && /^https?:\/\//.test(photo)) {
      const pic = node.querySelector(".pic"), tag = pic.querySelector(".tag");
      pic.replaceChildren(...(tag ? [tag] : []), el("img", { src: photo, alt: o.store_title || "", referrerpolicy: "no-referrer", loading: "lazy" }));
    }
    const sellerBox = node.querySelector(".seller");
    const fav = url ? favicon(url) : null;
    sellerBox.replaceChildren(...(fav ? [el("img", { src: fav, alt: "" })] : []), el("span", {}, seller),
      o.observed_at ? el("span", { class: "seen" }, (node.classList.contains("pcard") ? "" : "· ") + T.seenOn(day(o.observed_at))) : "");
    const price = fmt(o.price_minor / 100, o.currency);
    node.querySelector(".now").textContent = price;
    const facts = node.querySelector(".facts");
    const qty = plan.items.find((i) => i.offer_id === o.offer_id);
    facts.replaceChildren(
      o.shipping_status === "known"
        ? el("span", { class: "fact" + (o.shipping_minor === 0 ? " good" : "") }, o.shipping_minor === 0 ? "✓ " + T.shipFree : T.ship(fmt(o.shipping_minor / 100, o.currency)))
        : el("span", { class: "fact warn" }, T.shipUnknown),
      el("span", { class: "fact" + (o.tax_status === "known" ? "" : " warn") }, o.tax_status === "known" ? T.tax(fmt(o.tax_minor / 100, o.currency)) : T.taxNo),
      o.price_stale ? el("span", { class: "fact warn" }, T.stale) : "",
      qty && qty.quantity > 1 ? el("span", { class: "fact" }, T.qty(qty.quantity)) : "");
    const actions = node.querySelector(".actions");
    if (actions) actions.replaceChildren(
      url ? el("a", { class: "btn-accent", href: url, target: "_blank", rel: "noopener noreferrer" },
              (seller && !node.classList.contains("pcard") ? T.view(seller) : T.viewShop) + " ↗") : "",
      el("a", { class: "btn-line", href: "#sourcesAnchor" }, T.seeSources));
  }
  if (plan.items.length > 1) {                    // a set of products: list each one in the receipt
    const t = $("sumTable");
    t.querySelectorAll(".ln.item").forEach((n) => n.remove());
    t.querySelectorAll(".ln:not(.item)").forEach((n) => { if (n.firstChild && n.firstChild.textContent === T.items) n.remove(); });   // the lines below replace the subtotal
    t.prepend(...plan.items.map((it) => {
      const o = r.offers.find((x) => x.offer_id === it.offer_id);
      return o ? el("div", { class: "ln item" }, el("span", { title: o.store_title || "" }, (it.quantity > 1 ? it.quantity + " × " : "") + (shortTitle(o.store_title) || o.offer_id)),
                    el("span", {}, fmt(o.price_minor * it.quantity / 100, o.currency))) : "";
    }));
  }
  renderLead(plan);
  renderWhy(plan, r);
  const box = $("sources"); box.replaceChildren();
  r.evidence.forEach((e, i) => {
    const url = /^https?:\/\//.test(e.source_url || "") ? e.source_url : null;
    const host = url ? hostOf(url) : "";
    const fav = url ? favicon(url) : null;
    const body = [el("span", { class: "num" }, i + 1), ...(fav ? [el("img", { src: fav, alt: "" })] : []),
      el("span", {}, el("div", { class: "st" }, e.title || e.evidence_id),
        el("div", { class: "sd" }, [e.source_label || host || T.source, e.observed_at ? day(e.observed_at) : ""].filter(Boolean).join(" · ")),
        e.text ? el("div", { class: "sx" }, e.text) : "")];
    box.append(el("li", {}, url ? el("a", { class: "src", href: url, target: "_blank", rel: "noopener noreferrer" }, ...body) : el("div", { class: "src" }, ...body)));
  });
  show("sourcesCard", r.evidence.length > 0);
}

// ---- history (this browser only) ---------------------------------------------------------------------------------
const HKEY = "shop-advisor-history";
function loadHistory() { try { const h = JSON.parse(localStorage.getItem(HKEY) || "[]"); return Array.isArray(h) ? h : []; } catch (e) { return []; } }
function storeHistory(h) {
  for (let n = h.length; n > 0; n = Math.floor(n / 2)) {          // drop the oldest entries if storage is full
    try { localStorage.setItem(HKEY, JSON.stringify(h.slice(0, n))); return; } catch (e) {}
  }
}
function traceSnapshot() {
  return { steps: [...document.querySelectorAll("#stepper .step")].map((n) => n.className),
           search: [...$("dSearch").children].map((n) => [n.textContent, n.classList.contains("bad")]),
           compare: [...$("dCompare").children].map((n) => [n.textContent, n.classList.contains("bad")]),
           understand: $("dUnderstand").textContent, check: $("dCheck").textContent, explain: $("dExplain").textContent,
           log: [...$("steps").children].map((li) => [li.children[0].textContent, li.children[1].textContent, li.children[1].classList.contains("bad")]) };
}
function saveHistory() {
  const r = state.result;
  if (!r || !state.runId || !state.original) return;
  const entry = { id: state.runId, at: Date.now(), session, message: state.original.message, constraints: state.original.constraints,
                  result: r, look: state.look, doneIn: state.doneIn, fallback: state.fallback, trace: traceSnapshot(),
                  narrative: narr.text || "" };
  storeHistory([entry, ...loadHistory().filter((e) => e.id !== entry.id)].slice(0, 40));
  state.viewing = entry.id;
  renderHistory();
}
function renderHistory() {
  const h = loadHistory(), box = $("history"), T = L();
  box.replaceChildren();
  show("clearHistory", h.length > 0);
  if (!h.length) { box.append(el("div", { class: "empty" }, T.noHistory)); return; }
  const start = new Date(); start.setHours(0, 0, 0, 0);
  let group = null;
  for (const e of h) {
    const g = e.at >= start.getTime() ? T.today : T.earlier;
    if (g !== group) { box.append(el("h5", {}, g)); group = g; }
    const r = e.result || {}, p = r.verified_plan;
    const photo = p && e.look && e.look.photos && e.look.offers ? (() => { const o = e.look.offers.find((x) => x.offer_id === p.items[0].offer_id); return o && e.look.photos[o.variant_id]; })() : null;
    const pic = el("span", { class: "hp" }, photo && /^https?:\/\//.test(photo) ? el("img", { src: photo, alt: "", referrerpolicy: "no-referrer", loading: "lazy" }) : el("span", { html: ICONS.bag }));
    const meta = p ? el("span", { class: "hm" }, el("span", { class: "okc" }, "✓ "),
                        (p.items.length > 1 ? T.histItems(p.items.reduce((s, i) => s + i.quantity, 0)) + " · " : "") +
                        fmt(p.total_cost, p.currency) + " · " + T.histLeft(fmt(p.remaining_funds, p.currency)))
                   : el("span", { class: "hm" }, STATUS[LANG][r.status] || T.histStopped);
    const b = el("button", { class: "hitem" + (state.viewing === e.id ? " on" : ""), type: "button", title: e.message },
      pic, el("span", {}, el("div", { class: "ht" }, e.message.split("\nChange: ").pop()), meta));
    b.onclick = () => openHistory(e.id);
    box.append(b);
  }
}
function openHistory(id) {
  const e = loadHistory().find((x) => x.id === id);
  if (!e || state.busy) return;
  const cap = (e.constraints || {}).purchase_cap || "";
  resetRun(e.message, cap);
  Object.assign(state, { runId: e.id, viewSession: e.session, original: { message: e.message, constraints: e.constraints || {} },
                         look: e.look || null, doneIn: e.doneIn, fallback: !!e.fallback, viewing: e.id });
  $("runId").textContent = e.id;
  const t = e.trace || {};
  document.querySelectorAll("#stepper .step").forEach((n, i) => { if (t.steps && t.steps[i]) n.className = t.steps[i]; });
  for (const [box, list] of [["dSearch", t.search], ["dCompare", t.compare]]) (list || []).forEach(([text, bad]) => chip(box, text, bad));
  $("dUnderstand").textContent = t.understand || ""; $("dCheck").textContent = t.check || ""; $("dExplain").textContent = t.explain || "";
  (t.log || []).forEach(([time, text, bad]) => $("steps").append(el("li", {}, el("span", { class: "t" }, time), el("span", { class: bad ? "bad" : "" }, text))));
  $("trace").open = false; show("skel", false);
  render(e.result, true);
  if (e.narrative) { narr.text = e.narrative; narr.got = true; narr.streaming = false; show("whyNarr", true); renderNarr(); }
  renderHistory();
}
$("clearHistory").onclick = () => { try { localStorage.removeItem(HKEY); } catch (e) {} state.viewing = null; renderHistory(); };
$("sideNew").onclick = () => goHome();

// ---- requests -------------------------------------------------------------------------------------------------
function resetRun(bubbleText, cap) {
  Object.assign(state, { explain: "", pending: null, t0: performance.now(), result: null, look: null, fallback: false, answered: false,
                         rejectedAnswer: null, phase: "working", counts: { search: 0, read: 0, rejected: 0 } });
  narrReset(); $("steps").replaceChildren(); $("runId").textContent = "";
  for (const id of ["dSearch", "dCompare"]) $(id).replaceChildren();
  for (const id of ["dCheck", "dExplain"]) $(id).textContent = "";
  $("dUnderstand").textContent = cap ? `${L().budget} $${cap}` : L().noBudget;
  notice("streamError"); notice("topNotice"); notice("qNotice");
  document.querySelectorAll("#stepper .step").forEach(n => n.classList.remove("done", "active", "fail"));
  $("trace").open = true; setTitle("working");
  $("bubble").replaceChildren(bubbleText, cap ? el("span", { class: "meta" }, `${L().budget} $${cap}`) : "");
  show("home", false); show("thread", true); show("newChat", true); show("skel", true);
  for (const id of ["question", "result", "why", "summary", "refine", "sourcesCard", "lead", "stats"]) show(id, false);
  $("products").replaceChildren(); $("resultStatus").replaceChildren(); $("sources").replaceChildren();
  scrollTo({ top: 0 });
}

async function run(path, body) {
  setBusy(true);
  try {
    await streamCall(path, body, handle);
  } catch (e) {
    show("skel", false); setTitle("fail");
    notice("streamError", "err", e.message, () => { run(path, body); });
  } finally {
    setBusy(false);
  }
}

const money = (s) => /^\d+(\.\d{1,2})?$/.test(s);
function syncSend() { $("send").disabled = state.busy || !$("msg").value.trim(); }

function ask(message, cap) {
  message = (message || "").trim();
  if (!message) { notice("topNotice", "warn", L().needMsg); $("msg").focus(); return; }
  cap = (cap || "").trim();
  if (cap && !money(cap)) { notice("topNotice", "warn", L().capNum); $("cap").focus(); return; }
  const constraints = cap ? { purchase_cap: cap, currency: $("cur").value } : {};
  state.original = { message, constraints };
  resetRun(message, cap);
  Object.assign(state, { viewSession: session, viewing: null }); renderHistory();
  run("/api/ask", { message, constraints, explain: false });
}

function goHome() {
  if (state.busy && state.runId) cancel();
  narrReset(); state.result = null; state.viewing = null; renderHistory();
  show("thread", false); show("home", true); show("newChat", false);
  $("msg").value = ""; syncSend(); $("msg").focus(); scrollTo({ top: 0 });
}
$("brand").onclick = $("newChat").onclick = goHome;

$("msg").addEventListener("input", () => { syncSend(); const m = $("msg"); m.style.height = "auto"; m.style.height = m.scrollHeight + "px"; });
$("msg").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!state.busy) ask($("msg").value, $("cap").value); } });
$("searchForm").onsubmit = (e) => { e.preventDefault(); if (!state.busy) ask($("msg").value, $("cap").value); };

$("qForm").onsubmit = (e) => {
  e.preventDefault();
  const q = state.pending; if (!q || state.busy) return;
  const answer = {};
  for (const f of q.required_fields) {
    const v = $("q_" + f).value.trim();
    if (!v) { notice("qNotice", "warn", L().fill(fieldLabel(f))); return; }
    if (AMOUNT_FIELDS.has(f) && !money(v)) { notice("qNotice", "warn", L().number(fieldLabel(f))); return; }
    answer[f] = v;
  }
  notice("qNotice");
  state.answered = true;
  if (state.original) state.original.constraints = { ...state.original.constraints, ...answer };
  show("question", false); show("skel", true); setTitle("working"); $("trace").open = true;
  run("/api/answer", { run_id: state.runId, question_id: q.question_id, answer });
};

$("revMsg").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("revForm").requestSubmit(); } });
$("revForm").onsubmit = (e) => {
  e.preventDefault();
  const rev = $("revMsg").value.trim();
  if (!rev || !state.original || state.busy) { notice("streamError", "warn", L().sayChange); return; }
  const cap = $("revCap").value.trim();
  if (cap && !money(cap)) { notice("streamError", "warn", L().revNum); return; }
  const constraints = cap ? { ...state.original.constraints, purchase_cap: cap, currency: state.original.constraints.currency || "USD" }
                          : state.original.constraints;
  // The backend only links a revision to a run of this browser session; a run reopened from an older session's
  // history is revised as a fresh request.
  const parent = state.viewSession === session ? state.runId : null;
  const message = state.original.message + "\nChange: " + rev;
  state.original = { message, constraints };
  $("revMsg").value = ""; $("revCap").value = "";
  resetRun(message, constraints.purchase_cap || "");
  Object.assign(state, { viewSession: session, viewing: null }); renderHistory();
  run("/api/ask", { message, constraints, ...(parent ? { revises: parent } : {}), explain: false });
};

async function cancel() {
  if (!state.runId) return;
  await fetch("/api/cancel", { method: "POST", headers: { "Content-Type": "application/json" },
                               body: JSON.stringify({ session_id: session, run_id: state.runId }) });
  logStep(L().stopReq);
}
$("cancel").onclick = (e) => { e.preventDefault(); e.stopPropagation(); cancel(); };

applyLang(); syncSend();
health(); setInterval(health, 30000);
